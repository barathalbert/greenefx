    <!-- Testimonial indicators (safe if carousel is missing) -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const carousel = document.getElementById("testimonialCarousel");
        if (!carousel) return;

        const indicators = document.querySelectorAll(
          ".testimonial-indicators button",
        );

        carousel.addEventListener("slid.bs.carousel", function (event) {
          indicators.forEach((dot, index) => {
            dot.classList.remove("active");
            dot.removeAttribute("aria-current");
            if (index === event.to) {
              dot.classList.add("active");
              dot.setAttribute("aria-current", "true");
            }
          });
        });
      });
    </script>

    <!-- Background canvas + navbar scroll effect -->
    <script>
      (function () {
        const c = document.getElementById("bg");
        if (!c) return;

        const x = c.getContext("2d");
        const reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        let W,
          H,
          stars = [];

        function resize() {
          const r = c.parentElement.getBoundingClientRect();
          const d = Math.min(window.devicePixelRatio || 1, 2);
          W = r.width;
          H = r.height;
          c.width = W * d;
          c.height = H * d;
          x.setTransform(d, 0, 0, d, 0, 0);

          stars = Array.from({ length: Math.round((W * H) / 9000) }, () => ({
            x: Math.random() * W,
            y: Math.random() * H * 0.7,
            r: Math.random() * 1.8 + 0.5,
            p: Math.random() * 6.28,
            s: Math.random() * 2 + 0.5,
          }));
        }

        window.addEventListener("resize", resize);
        resize();

        const layers = [
          {
            y: 0.52,
            a: 0.13,
            sp: 0.00018,
            f: 3.2,
            c0: "rgba(33,120,180,.75)",
            c1: "rgba(15,60,105,.2)",
          },
          {
            y: 0.6,
            a: 0.1,
            sp: 0.00026,
            f: 4.5,
            c0: "rgba(24,95,150,.75)",
            c1: "rgba(15,55,95,.2)",
          },
          {
            y: 0.7,
            a: 0.08,
            sp: 0.00036,
            f: 6.0,
            c0: "rgba(18,70,115,.85)",
            c1: "rgba(19,58,94,.3)",
          },
        ];

        function ridge(t, L, k) {
          const u = k / W;
          return (
            H * L.y -
            H *
              L.a *
              (Math.sin(u * L.f * 6.28 + t * L.sp * 0.6) * 0.45 +
                Math.sin(u * L.f * 13 + t * L.sp) * 0.3 +
                Math.abs(Math.sin(u * L.f * 27 - t * L.sp * 1.4)) * 0.25)
          );
        }

        function frame(t) {
          x.clearRect(0, 0, W, H);

          for (const s of stars) {
            const blink = Math.sin(t * 0.001 * s.s + s.p);
            x.globalAlpha = reduce
              ? 0.8
              : 0.15 + 0.95 * Math.pow(Math.abs(blink), 3);
            x.fillStyle = "#ffffff";
            x.shadowBlur = 8;
            x.shadowColor = "rgba(255,255,255,0.9)";
            x.beginPath();
            x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            x.fill();
          }

          x.globalAlpha = 1;
          x.shadowBlur = 0;

          for (const L of layers) {
            const g = x.createLinearGradient(0, H * (L.y - L.a), 0, H);
            g.addColorStop(0, L.c0);
            g.addColorStop(1, L.c1);
            x.fillStyle = g;
            x.beginPath();
            x.moveTo(0, H);
            for (let k = 0; k <= W; k += 8) {
              x.lineTo(k, ridge(reduce ? 0 : t, L, k));
            }
            x.lineTo(W, H);
            x.closePath();
            x.fill();
          }

          if (!reduce) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      })();

    </script>

    <!-- Stat counters (safe if none exist) -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const counters = document.querySelectorAll(".stat");
        if (!counters.length) return;

        const observer = new IntersectionObserver(
          (entries, observer) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;

              const counter = entry.target;
              const target = Number(counter.dataset.count);
              const suffix = counter.dataset.suffix || "";
              const duration = 2000;
              const increment = target / (duration / 16);
              let count = 0;

              function updateCounter() {
                count += increment;
                if (count < target) {
                  counter.textContent = Math.ceil(count) + suffix;
                  requestAnimationFrame(updateCounter);
                } else {
                  counter.textContent = target + suffix;
                }
              }

              updateCounter();
              observer.unobserve(counter);
            });
          },
          { threshold: 0.5 },
        );

        counters.forEach((counter) => observer.observe(counter));
      });
    </script>

    <!-- Enquiry form (only runs if the form exists on the page) -->
    <script>
      const enquiryForm1 = document.getElementById("enquiryForm");

      if (enquiryForm1) {
        const submitBtn1 = document.getElementById("submitBtn1");
        const thankYouMessage1 = document.getElementById("thankYouMessage1");
        const formError1 = document.getElementById("formError1");

        enquiryForm1.addEventListener("submit", async function (e) {
          e.preventDefault();

          if (!enquiryForm1.checkValidity()) {
            enquiryForm1.reportValidity();
            return;
          }

          submitBtn1.disabled = true;
          submitBtn1.textContent = "Submitting...";
          formError1.classList.add("d-none");

          try {
            const formData1 = new FormData(enquiryForm1);

            if (formData1.get("website1")) {
              throw new Error("Invalid submission");
            }

            await fetch(
              "https://script.google.com/macros/s/AKfycbz06l0jNWXfmrOqLwu_ByDzSJKs4WtTA3jHfZFmJ10sKgHwOuEHgFv-AL6CZQ4YBBBB/exec",
              {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                  name: formData1.get("name1"),
                  email: formData1.get("email1"),
                  message: formData1.get("message1"),
                  website: formData1.get("website1"),
                }),
              },
            );

            // no-cors cannot verify backend success.
            enquiryForm1.classList.add("d-none");
            thankYouMessage1.classList.remove("d-none");
            enquiryForm1.reset();
          } catch (error) {
            formError1.classList.remove("d-none");
          } finally {
            submitBtn1.disabled = false;
            submitBtn1.textContent = "Submit Enquiry";
          }
        });
      }
    </script>

        if (!sections || !modalEl) return;

        const modal = new bootstrap.Modal(modalEl);

        let items = []; // [{ img, video }] for the category open in the modal
        let current = 0;

        // Accepts youtube, watch?v=, embed/, shorts/ and live/ links
        function youtubeId(url) {
          if (!url) return null;
          const m = String(url).match(
            /(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/,
          );
          return m ? m[1] : null;
        }

          heading.className = "gx-section-title";
          heading.textContent = cat.title;

          for (let i = 1; i <= cat.total; i++) {
            const src = `${cat.folder}/${i}.${cat.ext}`;
            const vid = youtubeId(cat.videos && cat.videos[i]);
            const item = document.createElement("div");
            item.className = "gx-item" + (vid ? " is-video" : "");
            item.style.setProperty("--r", 1.5);
            item.dataset.img = src;
            if (vid) item.dataset.video = vid;
            const el = document.createElement("img");
            el.src = src;
            el.loading = "lazy";
            el.alt = vid
              ? `${cat.title} video ${i}`
              : `${cat.title} image ${i}`;
            // use each image's real shape so wide and tall photos mix automatically
            el.addEventListener("load", () =>
              item.style.setProperty(
                "--r",
                (el.naturalWidth / el.naturalHeight).toFixed(3),
              ),
            );
            el.addEventListener("error", () => {
              // no thumbnail file? use YouTube's own thumbnail for video items
              if (vid && !el.dataset.fallback) {
                el.dataset.fallback = "1";
                el.src = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
                return;
              }
              // otherwise remove the slot, and hide the section if it ends up empty

              if (!grid.querySelector(".gx-item")) section.remove();
            });
            item.appendChild(el);
            if (vid) {
              const play = document.createElement("span");
              play.className = "gx-play";
              play.innerHTML = playIcon;
              item.appendChild(play);
            }
            item.addEventListener("click", () => {
              // build the list from items that still exist (missing files are skipped)
              const nodes = Array.from(grid.querySelectorAll(".gx-item"));
              items = nodes.map((n) => ({
                img: n.dataset.img,
                video: n.dataset.video || null,
              }));
              show(nodes.indexOf(item));
              modal.show();
            });
            grid.appendChild(item);
          }
          section.append(heading, grid);
          sections.appendChild(section);
        });
        function stopVideo() {
          videoFrame.src = ""; // unloads the player so audio stops

        function show(i) {
          if (!items.length) return;
          current = (i + items.length) % items.length;
          const it = items[current];
          stopVideo();
          if (it.video) {
            modalImg.classList.add("d-none");
            videoWrap.classList.remove("d-none");
            videoFrame.src = `https://www.youtube.com/embed/${it.video}?autoplay=1&rel=0`;
          } else {
            videoWrap.classList.add("d-none");
            modalImg.classList.remove("d-none");
            modalImg.src = it.img;
          }
          counter.textContent = current + 1 + " / " + items.length;
        }
        // stop playback whenever the popup closes
        modalEl.addEventListener("hidden.bs.modal", stopVideo);
        document.getElementById("gxPrev").onclick = () => show(current - 1);
        document.getElementById("gxNext").onclick = () => show(current + 1);
        document.addEventListener("keydown", (e) => {
          if (!modalEl.classList.contains("show")) return;
          if (e.key === "ArrowLeft") show(current - 1);
          if (e.key === "ArrowRight") show(current + 1);
        });
      });
    </script>
  </body>
</html>
