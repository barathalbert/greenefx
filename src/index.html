        const carousel = document.getElementById("testimonialCarousel");

        if (!carousel) return;

        const indicators = document.querySelectorAll(
          ".testimonial-indicators button",
        );

        carousel.addEventListener("slid.bs.carousel", function (event) {

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const scriptURL =
          "https://script.google.com/macros/s/AKfycbyMPv5I6HbRfipj8_zN3xHZdzJoKicrLOdsI9auDAkF_5-Ps83ekf7qtYp1-gZ8tJuWhg/exec";

        const form = document.getElementById("contactForm");
        const successMessage = document.getElementById("successMessage");
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          form.classList.add("was-validated");

          if (!form.checkValidity()) {
            return;
          }

          submitButton.disabled = true;
          submitButton.innerHTML = "Sending...";

          successMessage.classList.add("d-none");

          try {
            const formData = new FormData(form);

            const response = await fetch(scriptURL, {
              method: "POST",
              body: new URLSearchParams(formData),
              mode: "no-cors",
            });

            // no-cors responses are opaque, so this confirms only dispatch.
            successMessage.classList.remove("d-none");
            successMessage.innerHTML =
              '<i class="bi bi-check-circle-fill me-2"></i>' +
              " Your message has been sent successfully. Our team will get back to you shortly.";

            form.reset();
            form.classList.remove("was-validated");
          } catch (error) {
            console.error("Error:", error);

            alert("Something went wrong. Please try again.");
          } finally {
            submitButton.disabled = false;
            submitButton.innerHTML =
              'Send Message <i class="bi bi-send-fill ms-2"></i>';
          }
        });
      });
    </script>
<script>
  (function () {
    const c = document.getElementById("bg");
    if (!c) return;

    const x = c.getContext("2d");

    const reduce = window.matchMedia(
      "(prefers-reduced-motion: reduce)",
    ).matches;

    let W,
      H,
      stars = [];
    let cx, cy, R; // star circle: center + radius

    // Offscreen canvas for mountains (so the left-to-right mask doesn't affect stars)
    const mc = document.createElement("canvas");
    const mx = mc.getContext("2d");

    // Resize canvas + build stars inside the circle
    function resize() {
      const r = c.parentElement.getBoundingClientRect();
      const d = Math.min(window.devicePixelRatio || 1, 2);

      W = r.width;
      H = r.height;

      c.width = W * d;
      c.height = H * d;

      x.setTransform(d, 0, 0, d, 0, 0);

      mc.width = c.width;
      mc.height = c.height;
      mx.setTransform(d, 0, 0, d, 0, 0);

      // Position the circle on the right image.
      // Change the selector below to match your right-side image.
      const img = document.querySelector(".hero-image img, .hero-img");
      if (img) {
        const ir = img.getBoundingClientRect();
        cx = ir.left - r.left + ir.width / 2;
        cy = ir.top - r.top + ir.height / 2;
        R = Math.max(ir.width, ir.height) * 0.6;
      } else {
        // Fallback: right side of the banner
        cx = W * 0.58;
        cy = H * 0.40;
        R = Math.min(W, H) * 0.70;
      }

      // Create stars only inside the circle
      const count = Math.round((Math.PI * R * R) / 4500);
      stars = Array.from({ length: count }, () => {
        const ang = Math.random() * Math.PI * 2;
        const rad = R * Math.sqrt(Math.random()); // even spread
        return {
          x: cx + Math.cos(ang) * rad,
          y: cy + Math.sin(ang) * rad,
          d: rad / R, // 0 = center, 1 = edge
          r: Math.random() * 1.8 + 0.5,
          p: Math.random() * 6.28,
          s: Math.random() * 2 + 0.5,
        };
      });
    }

    window.addEventListener("resize", resize);
    resize();

    // Mountain layers
    // color = single mountain color, o = layer opacity
    const layers = [
      {
        y: 0.52,
        a: 0.13,
        sp: 0.00018,
        f: 3.2,
        color: "#080F14",
        o: 1,
      },
      {
        y: 0.6,
        a: 0.1,
        sp: 0.00026,
        f: 4.5,
        color: "#080F14",
        o: 0.9,
      },
      {
        y: 10.7, // (off-screen: set to ~0.7 to show this front layer)
        a: 0.08,
        sp: 0.00036,
        f: 6.0,
        color: "#080F14",
        o: 1,
      },
    ];

    // Mountain ridge calculation
    function ridge(t, L, k) {
      const u = k / W;

      return (
        H * L.y -
        H *
          L.a *
          (Math.sin(u * L.f * 6.28 + t * L.sp * 0.6) * 0.45 +
            Math.sin(u * L.f * 13 + t * L.sp) * 0.3 +
            Math.abs(Math.sin(u * L.f * 27 - t * L.sp * 1.4)) * 0.25)
      );
    }

    // Animation
    function frame(t) {
      x.clearRect(0, 0, W, H);

      // Faint circular glow behind the image (transparent on the left, visible on the right)
      const glow = x.createRadialGradient(cx, cy, 0, cx, cy, R);
      glow.addColorStop(0, "rgba(120,160,255,0.14)");
      glow.addColorStop(1, "rgba(120,160,255,0)");
      x.globalAlpha = 1;
      x.fillStyle = glow;
      x.beginPath();
      x.arc(cx, cy, R, 0, Math.PI * 2);
      x.fill();

      // Horizontal mask: left = transparent, right = visible
      x.globalCompositeOperation = "destination-in";
      const mask = x.createLinearGradient(cx - R, 0, cx + R, 0);
      mask.addColorStop(0, "rgba(0,0,0,0)");
      mask.addColorStop(0.35, "rgba(0,0,0,0.25)");
      mask.addColorStop(1, "rgba(0,0,0,1)");
      x.fillStyle = mask;
      x.fillRect(0, 0, W, H);
      x.globalCompositeOperation = "source-over";

      // White blinking and glowing stars (circle area only)
      for (const s of stars) {
        const blink = Math.sin(t * 0.001 * s.s + s.p);

        let a = reduce ? 0.8 : 0.15 + 0.95 * Math.pow(Math.abs(blink), 3);

        // Soft fade toward the circle edge
        a *= 1 - Math.pow(s.d, 2) * 0.85;

        // Left-to-right gradient: transparent on the left, visible on the right
        const hx = Math.min(1, Math.max(0, (s.x - (cx - R)) / (2 * R)));
        a *= Math.pow(hx, 1.6);

        x.globalAlpha = a;
        x.fillStyle = "#ffffff";

        // Glow effect
        x.shadowBlur = 8;
        x.shadowColor = "rgba(255,255,255,0.9)";

        x.beginPath();
        x.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        x.fill();
      }

      // Reset canvas effects
      x.globalAlpha = 1;
      x.shadowBlur = 0;

      // Animated mountain layers (drawn offscreen, then masked)
      mx.globalCompositeOperation = "source-over";
      mx.clearRect(0, 0, W, H);

      for (const L of layers) {
        // Single solid color
        mx.globalAlpha = L.o;
        mx.fillStyle = L.color;

        mx.beginPath();
        mx.moveTo(0, H);

        for (let k = 0; k <= W; k += 8) {
          mx.lineTo(k, ridge(reduce ? 0 : t, L, k));
        }

        mx.lineTo(W, H);
        mx.closePath();
        mx.fill();
      }
      mx.globalAlpha = 1;

      // Horizontal mask: left = transparent, right = mountains visible
      mx.globalCompositeOperation = "destination-in";
      const mMask = mx.createLinearGradient(0, 0, W, 0);
      mMask.addColorStop(0, "rgba(0,0,0,0)");
      mMask.addColorStop(0.3, "rgba(0,0,0,0.1)");
      mMask.addColorStop(0.65, "rgba(0,0,0,0.8)");
      mMask.addColorStop(1, "rgba(0,0,0,1)");
      mx.fillStyle = mMask;
      mx.fillRect(0, 0, W, H);
      mx.globalCompositeOperation = "source-over";

      // Draw masked mountains onto the main canvas
      x.drawImage(mc, 0, 0, W, H);

      // Continue animation
      if (!reduce) {
        requestAnimationFrame(frame);
      }
    }

    requestAnimationFrame(frame);
  })();

</script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const counters = document.querySelectorAll(".stat");

        const observer = new IntersectionObserver(
          (entries, observer) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const counter = entry.target;
                const target = Number(counter.dataset.count);
                const suffix = counter.dataset.suffix || "";

                let count = 0;
                const duration = 2000;
                const increment = target / (duration / 16);

                function updateCounter() {
                  count += increment;

                  if (count < target) {
                    counter.textContent = Math.ceil(count) + suffix;
                    requestAnimationFrame(updateCounter);
                  } else {
                    counter.textContent = target + suffix;
                  }
                }

                updateCounter();
                observer.unobserve(counter);
              }
            });
          },
          { threshold: 0.5 },
        );

        counters.forEach((counter) => observer.observe(counter));
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // ===== SETTINGS =====
        const folder = "img/gallery"; // your folder name (use 'images/gallery' if it's inside images)
        const total = 25; // number of images
        const ext = "jpg"; // file extension
        // Files must be named 1.jpg, 2.jpg ... 25.jpg
        // ====================

        const images = Array.from(
          { length: total },
          (_, i) => `${folder}/${i + 1}.${ext}`,
        );

        const grid = document.getElementById("gxGrid");
        const modalEl = document.getElementById("gxModal");
        const modalImg = document.getElementById("gxModalImg");
        const counter = document.getElementById("gxCounter");
        const modal = new bootstrap.Modal(modalEl);
        let current = 0;

        images.forEach((src, i) => {
          const item = document.createElement("div");
          item.className = "gx-item";
          item.style.setProperty("--r", 1.5);

          const el = document.createElement("img");
          el.src = src;
          el.loading = "lazy";
          el.alt = "Gallery image " + (i + 1);

          // use each image's real shape so wide and tall photos mix automatically
          el.addEventListener("load", () =>
            item.style.setProperty(
              "--r",
              (el.naturalWidth / el.naturalHeight).toFixed(3),
            ),
          );

          // hide the slot if a file is missing
          el.addEventListener("error", () => item.remove());

          item.appendChild(el);
          item.addEventListener("click", () => {
            show(i);
            modal.show();
          });
          grid.appendChild(item);
        });

        function show(i) {
          current = (i + images.length) % images.length;
          modalImg.src = images[current];
          counter.textContent = current + 1 + " / " + images.length;
        }

        document.getElementById("gxPrev").onclick = () => show(current - 1);
        document.getElementById("gxNext").onclick = () => show(current + 1);

        document.addEventListener("keydown", (e) => {
          if (!modalEl.classList.contains("show")) return;
          if (e.key === "ArrowLeft") show(current - 1);
          if (e.key === "ArrowRight") show(current + 1);
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        const nav = document.getElementById("nav");
        const toggler = document.querySelector(".custom-toggler");

        if (!nav || !toggler) return;

        nav.addEventListener("shown.bs.collapse", function () {

        });

        nav.addEventListener("hidden.bs.collapse", function () {
          toggler.setAttribute("aria-expanded", "false");
        });
      });
    </script>
